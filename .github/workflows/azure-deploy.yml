name: Deploy to Azure

# Despliegue continuo a Azure App Service (Web App for Containers).
#
# En "Azure for Students" no se puede usar OIDC (app registration bloqueada por
# el tenant) ni ACR Tasks. Por eso este workflow solo construye la imagen con
# Docker en el runner (amd64) y la sube al ACR con credenciales de admin; la Web
# App tiene "continuous deployment" habilitado + un webhook del ACR, así que se
# auto-actualiza al detectar el push de la etiqueta :latest.
#
# Las migraciones de Prisma se ejecutan al iniciar el contenedor (ver Dockerfile).
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   ACR_LOGIN_SERVER  (p. ej. acrbuzonXXXX.azurecr.io)
#   ACR_USERNAME
#   ACR_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: buzon-utmach

jobs:
  deploy:
    name: Build & push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login al Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_LOGIN_SERVER }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build & push de la imagen
        run: |
          IMG="${{ secrets.ACR_LOGIN_SERVER }}/${IMAGE_NAME}"
          docker build -t "$IMG:latest" .
          docker push "$IMG:latest"
          echo "Imagen publicada. App Service se actualizará vía el webhook del ACR."
